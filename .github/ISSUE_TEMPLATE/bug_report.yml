name: Bug report
description: The scraper ran but the result was wrong, empty, or it crashed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before anything else: never paste an API key, a proxy password or a
        full `ws://user:pass@...` endpoint into a public issue.** The scrapers
        mask credentials in their own logs, but raw HTML dumps and the Scraper
        API's `x-debug` header do not. Replace them with `***`.

        Two things answer most reports faster than we can:

        - **Everything exit 3?** Check the exit address first. Etsy's
          DataDome answers every datacentre and VPN IP with HTTP 403, so a run
          from a VPS or a CI runner is blocked whatever else is set. If the
          log says `t=bv`, a captcha key does not help — that challenge is
          not solvable. The Scraping Browser API (`--cdp-endpoint`) is the
          path that works; if a profile keeps refusing after three retries,
          try a different `pid`.
        - **Zero products?** You may be on a page that has none — a taxonomy
          hub, or one page past the end of a listing. It answers 200 with
          nothing on it, which is exit 4 and a correct answer. See
          [TROUBLESHOOTING.md](../blob/main/TROUBLESHOOTING.md).
        - **`rating` empty on every row?** That is expected on a listing run:
          Etsy publishes no per-listing rating there. The stars you see on a
          tile are the shop's and are in `shop_rating`. See the README.
        - **Wrong currency or language?** Etsy decides both from your exit
          IP, not from the URL — a request for `/fr/…` from a German exit is
          redirected to `/de/…`. The row's `url` says which storefront
          actually answered.

  - type: dropdown
    id: engine
    attributes:
      label: Which engine
      options:
        - playwright_scraper.py
        - puppeteer_scraper.py
        - selenium_scraper.py
        - scraper_api_client.py
        - fingerprint_client.py
        - other / not sure
    validations:
      required: true

  - type: dropdown
    id: browser_route
    attributes:
      label: How was the browser reached
      options:
        - A browser the script launched itself
        - A remote browser over --cdp-endpoint
        - No browser (scraper_api_client.py over plain HTTP)
        - Not applicable
    validations:
      required: true

  - type: input
    id: exit_code
    attributes:
      label: Exit code
      description: >-
        `echo $?` straight after the run. These mean specific things — 3 is a
        challenge page, 4 is "ran fine, found nothing", 124 is a self-imposed
        timeout. The table is in the README.
      placeholder: "4"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The exact command
      description: With credentials replaced by `***`.
      render: shell
      placeholder: |
        python3 playwright_scraper.py \
          --url "https://www.etsy.com/search?q=handmade+mug" \
          --pages 3 --out grills
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: >-
        The whole run, not just the last line — the useful detail is usually
        upstream of the error. Credentials replaced by `***`.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      placeholder: >-
        96 products, as the README says a category page yields.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please run and paste:
        ```
        python3 -c "import sys, platform; print(sys.version, platform.platform())"
        pip list 2>/dev/null | grep -Ei "playwright|pyppeteer|selenium|beautifulsoup4|requests|webdriver"
        python3 smoke_test.py | tail -3
        ```
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The offline suite passes on my machine (`python3 smoke_test.py`)
          required: true
        - label: I removed every API key, password and credentialled URL from this report
          required: true
